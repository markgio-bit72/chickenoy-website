<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
    <title>Menu - Chickenoy | Order Fried Chicken Online</title>
    <meta name="description" content="Browse our delicious menu of crispy fried chicken, sides, and more. Order online from Chickenoy for fast delivery.">
    <meta name="keywords" content="fried chicken menu, chicken orders, food delivery, crispy chicken">
    <meta name="theme-color" content="#e63946">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Menu - Chickenoy Fried Chicken">
    <meta property="og:description" content="Browse our delicious menu of crispy fried chicken and sides. Order online for fast delivery.">
    <meta property="og:image" content="../images/og-image.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Menu - Chickenoy">
    <meta name="twitter:description" content="Browse our delicious menu of crispy fried chicken.">
    
    <!-- Mobile & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        /* ENHANCED MENU CARD STYLES - 2-2-1 LAYOUT */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(20px, 3vw, 30px);
            padding: clamp(20px, 3vw, 30px);
            max-width: 900px;
            margin: 0 auto;
            justify-items: center;
        }

        .menu-card {
            background: #1a1a1a !important;
            border-radius: var(--radius);
            padding: 0;
            box-shadow: var(--shadow);
            transition: all 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 300px;
            border: 2px solid transparent;
            position: relative;
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .menu-card:nth-child(1) { animation-delay: 0s; }
        .menu-card:nth-child(2) { animation-delay: 0.1s; }
        .menu-card:nth-child(3) { animation-delay: 0.2s; }
        .menu-card:nth-child(4) { animation-delay: 0.3s; }
        .menu-card:nth-child(5) { 
            animation-delay: 0.4s;
            grid-column: 1 / -1;
            max-width: 300px;
        }

        .menu-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            border-color: var(--accent);
        }

        .menu-card-image {
            width: 100%;
            height: 240px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
        }

        .menu-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 400ms ease;
        }

        .menu-card:hover img {
            transform: scale(1.12) rotate(2deg);
        }

        .menu-card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--accent), #f2a600);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(255, 190, 11, 0.3);
        }

        .menu-card-content {
            padding: clamp(16px, 3vw, 22px);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .menu-card h3 {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: var(--brand);
            margin: 0 0 clamp(8px, 1.5vw, 12px);
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .menu-card p {
            color: var(--muted);
            font-size: clamp(0.85rem, 1.8vw, 0.95rem);
            margin: 0 0 clamp(12px, 2vw, 16px);
            flex-grow: 1;
            line-height: 1.6;
        }

        .menu-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .menu-card-price {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            color: var(--brand);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .menu-card-stock {
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 5px 9px;
            border: 1px solid rgba(255, 190, 11, 0.35);
            border-radius: 6px;
        }

        .menu-card-actions {
            display: grid;
            grid-template-columns: 1fr 0.7fr;
            gap: 10px;
            margin-top: 14px;
        }

        .menu-card button {
            background: linear-gradient(135deg, #ffbe0b, #f2a600);
            border: none;
            padding: clamp(10px, 2vw, 14px) clamp(14px, 3vw, 18px);
            color: #000000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: clamp(0.8rem, 1.8vw, 0.95rem);
            transition: all 300ms ease;
            box-shadow: 0 6px 15px rgba(255, 190, 11, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-card .btn-buy-now {
            background: #ffffff;
            color: #1a1a1a;
        }

        .menu-card button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 190, 11, 0.45);
        }

        .menu-card button:active {
            transform: translateY(-1px);
        }

        .menu-card button.added,
        .menu-card button:disabled {
            background: #2f9e44;
            color: #ffffff;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        .menu-section {
            padding: clamp(30px, 5vw, 50px) 20px;
            text-align: center;
            max-width: 1400px;
            margin: 0 auto;
            background-color: #2d2415 !important;
        }

        .menu-section h2 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--brand);
            margin-bottom: clamp(10px, 2vw, 20px);
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .menu-section > p {
            color: var(--muted);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            margin-bottom: clamp(20px, 4vw, 40px);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .order-flow {
            display: grid;
            grid-template-columns: repeat(8, minmax(82px, 1fr));
            gap: 8px;
            max-width: 980px;
            margin: 0 auto 24px;
        }

        .order-flow span {
            color: #ffffff;
            border: 1px solid rgba(255, 190, 11, 0.35);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 9px 8px;
            font-weight: 700;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f0f0f0;
            border-top: 3px solid var(--brand);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .menu-card-image {
                height: 180px;
            }

            .menu-card-badge {
                font-size: 10px;
                padding: 5px 10px;
            }
        }

        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 12px;
            }

            .menu-card-image {
                height: 160px;
            }

            .menu-card-content {
                padding: 12px;
            }

            .menu-card h3 {
                font-size: 1rem;
            }

            .menu-card p {
                font-size: 0.8rem;
            }

            .menu-card-price {
                font-size: 1.3rem;
            }

            .menu-card-actions,
            .order-flow {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html" class="navbar-logo"><img src="../images/logo.png" alt="Chickenoy" onerror="this.style.display='none'; this.nextSibling.style.display='inline'"><span style="display:none">🍗 Chickenoy</span></a>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="menu.html" class="active">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="dashboard.html">Orders</a>
        </div>
        <div class="auth-buttons">
            <button class="login-btn" id="loginBtn" onclick="window.location='login.html'">Login</button>
            <button class="signin-btn" id="signinBtn" onclick="window.location='register.html'">Sign In</button>
            <button class="logout-btn" id="logoutBtn" onclick="logout()">Logout</button>
        </div>
        <span class="menu-toggle" id="menuToggle">☰</span>
    </nav>

    <main>
        <section class="menu-section">
            <h2>🍗 Our Fried Chicken Menu</h2>
            <p>Freshly prepared crispy fried chicken made with premium ingredients. Choose your favorite and add to cart!</p>
            <div class="order-flow" aria-label="Order process">
                <span>Browse</span>
                <span>Select</span>
                <span>Add to Cart</span>
                <span>Pay</span>
                <span>Process</span>
                <span>Ship</span>
                <span>Receive</span>
                <span>Review</span>
            </div>
            <div id="menuContainer" class="menu-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Chickenoy. All rights reserved. 🍗</p>
    </footer>

    <script>
    function toggleMenu() {
      const navLinks = document.getElementById('navLinks');
      const authButtons = document.querySelector('.auth-buttons');
      const menuToggle = document.querySelector('.menu-toggle');
      
      navLinks.classList.toggle('active');
      if (authButtons) authButtons.classList.toggle('active');
      
      // Close menu when clicking a link
      const links = navLinks.querySelectorAll('a');
      links.forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('active');
          if (authButtons) authButtons.classList.remove('active');
        });
      });
    }

    // Add click event listener to menu toggle
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.getElementById('menuToggle');
      if (menuToggle) {
        menuToggle.addEventListener('click', toggleMenu);
      }
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      const nav = document.querySelector('nav');
      const navLinks = document.getElementById('navLinks');
      const menuToggle = document.querySelector('.menu-toggle');
      
      if (nav && !nav.contains(e.target) && navLinks.classList.contains('active')) {
        navLinks.classList.remove('active');
        const authButtons = document.querySelector('.auth-buttons');
        if (authButtons) authButtons.classList.remove('active');
      }
    });

    // Close menu on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const navLinks = document.getElementById('navLinks');
        const authButtons = document.querySelector('.auth-buttons');
        navLinks.classList.remove('active');
        if (authButtons) authButtons.classList.remove('active');
      }
    });

    // Set active link based on current page
    document.addEventListener('DOMContentLoaded', () => {
      const currentPage = window.location.pathname;
      const navLinks = document.querySelectorAll('.nav-links a');
      navLinks.forEach(link => {
        if (link.getAttribute('href').includes(currentPage.split('/').pop())) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    });
    </script>
    <script src="../JS/menu.js?v=3"></script>
    <script src="../JS/common.js?v=2"></script>
    <!-- PWA and Service Worker Setup -->
    <script src="../JS/pwa-setup.js"></script>
    <!-- Offline Error Handler -->
    <script src="../JS/offline-handler.js?v=2"></script>
</body>
</html>
